# fly.toml app configuration file for Fly.io
# Run "fly launch" or "fly deploy" to deploy this application

app = "two-hours-one-life-frontend"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

# Optional caching headers and basic checks can be configured on the Cloudflare side
